# DKMS configuration for the Quark kernel module (release build: VM check
# enforced). @PKGVER@ is substituted by the distro package build.
PACKAGE_NAME="quark-anticheat"
PACKAGE_VERSION="@PKGVER@"
BUILT_MODULE_NAME[0]="quark_kernel"
DEST_MODULE_LOCATION[0]="/updates/dkms"
# Generates the per-machine signing key (first build only) and the two headers
# the module embeds: the matching public key and the installed quark_cli's hash.
PRE_BUILD="quark-dkms-prebuild.sh"
MAKE[0]="make KDIR=${kernel_source_dir}"
AUTOINSTALL="yes"
